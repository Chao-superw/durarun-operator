apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: durarun-agent-deny-all
spec:
  podSelector:
    matchExpressions:
      - key: durarun.io/job
        operator: Exists
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 9000
